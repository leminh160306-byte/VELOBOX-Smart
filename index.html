<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOBOX - Hệ Thống Hộp Nhận Hàng Thông Minh (Full RBAC)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            850: '#0f3c20',
                            900: '#14532d',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-full flex flex-col overflow-hidden">

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP PHÂN QUYỀN (LOGIN SCREEN) -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 space-y-6 border border-slate-100">
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-brand-600 text-white flex items-center justify-center text-3xl mx-auto shadow-lg mb-3">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">VELOBOX SYSTEM</h2>
                <p class="text-xs text-slate-500 mt-1">Hệ thống Tủ Giao Nhận Hàng Thông Minh (ĐH Thủy Lợi)</p>
            </div>

            <!-- Phím chọn nhanh tài khoản mẫu cho giảng viên -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                <span class="text-xs font-bold text-slate-700 block"><i class="fa-solid fa-bolt text-amber-500"></i> Chọn nhanh tài khoản phân quyền để kiểm tra:</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="fillLogin('resident', 'linh.vt', '123')" class="bg-white hover:bg-brand-50 border p-2 rounded-xl text-xs font-semibold text-slate-700 transition shadow-sm">👤 Cư dân</button>
                    <button onclick="fillLogin('shipper', 'shipper.spx', '123')" class="bg-white hover:bg-brand-50 border p-2 rounded-xl text-xs font-semibold text-slate-700 transition shadow-sm">🚚 Shipper</button>
                    <button onclick="fillLogin('admin', 'admin.velobox', '123')" class="bg-white hover:bg-brand-50 border p-2 rounded-xl text-xs font-semibold text-slate-700 transition shadow-sm">⚙️ Quản trị</button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Tên đăng nhập / Username:</label>
                    <input type="text" id="loginUsername" placeholder="Nhập username..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu / Password:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-600">
                </div>
                <button onclick="handleLogin()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 rounded-xl text-sm shadow-lg shadow-brand-900/20 transition">
                    Đăng nhập hệ thống <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH SAU KHI ĐĂNG NHẬP (APP SCREEN) -->
    <div id="app-screen" class="h-full flex flex-col hidden">
        <!-- Top Navigation Header -->
        <header class="bg-slate-900 text-white shadow-md z-30 flex-shrink-0">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-brand-500 text-white p-2 rounded-xl shadow-lg flex items-center justify-center w-10 h-10">
                        <i class="fa-solid fa-box-open text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                            VELOBOX <span class="text-xs bg-brand-500/20 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-full font-medium">Smart Locker Full Suite</span>
                        </h1>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2 pl-3 border-l border-slate-700">
                        <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-brand-400 font-bold text-sm border border-slate-600" id="userAvatar">HL</div>
                        <div class="text-left hidden sm:block">
                            <div class="text-xs font-semibold text-slate-200" id="userName">Vũ Trần Huyền Linh</div>
                            <div class="text-[10px] text-brand-400" id="userRoleBadge">Cư dân - Căn hộ A-1204</div>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 text-xs font-medium px-3 py-2 rounded-xl transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar Navigation -->
            <aside class="w-20 md:w-64 bg-slate-900/95 border-r border-slate-800 flex flex-col justify-between flex-shrink-0 z-20">
                <nav class="p-3 space-y-1.5" id="sidebarNav"></nav>
                <div class="p-3 m-3 bg-slate-800/80 rounded-xl border border-slate-700/60 hidden md:block text-xs text-slate-400">
                    <p class="font-semibold text-slate-200">Trạm VELOBOX Sảnh A</p>
                    <p class="mt-1">Ô trống: <span class="text-emerald-400 font-bold">14/24 ô</span></p>
                </div>
            </aside>

            <!-- Dynamic Workspace Content Area -->
            <main class="flex-1 bg-slate-100 overflow-y-auto relative" id="mainContentArea"></main>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Cơ sở dữ liệu chia sẻ mô phỏng kết nối thời gian thực giữa các vai trò
        let appState = {
            currentUser: null,
            parcels: [
                { id: 'VB-89214', store: 'Shopee - Thời Trang Nam', receiver: 'Vũ Trần Huyền Linh', locker: 'A-04 (M)', status: 'Chờ lấy hàng', time: '14:20 - Hôm nay', pin: '849201', fee: 0, overdue: false },
                { id: 'VB-87210', store: 'TikTok Shop - Mỹ Phẩm', receiver: 'Vũ Trần Huyền Linh', locker: 'A-02 (S)', status: 'Quá hạn (Phí: 10k)', time: 'Hôm qua, 08:00', pin: '739201', fee: 10000, overdue: true },
                { id: 'VB-88932', store: 'Lazada - Điện Gia Dụng', receiver: 'Vũ Trần Huyền Linh', locker: 'B-01 (L)', status: 'Đã hoàn thành', time: 'Hôm qua, 18:35', pin: '192847', fee: 0, overdue: false }
            ],
            lockers: [
                { id: 'A-01', size: 'S', status: 'available' },
                { id: 'A-02', size: 'S', status: 'occupied' },
                { id: 'A-03', size: 'M', status: 'available' },
                { id: 'A-04', size: 'M', status: 'occupied' },
                { id: 'B-01', size: 'L', status: 'occupied' }
            ]
        };

        const usersDatabase = [
            { username: 'linh.vt', pass: '123', role: 'resident', name: 'Vũ Trần Huyền Linh', badge: 'Cư dân - Căn hộ A-1204', avatar: 'HL' },
            { username: 'shipper.spx', pass: '123', role: 'shipper', name: 'Phạm Ngọc Tuấn Hùng', badge: 'Shipper - SPX Express Partner', avatar: 'HN' },
            { username: 'admin.velobox', pass: '123', role: 'admin', name: 'ThS. Bùi Thị Giang', badge: 'Quản Trị Viên Hệ Thống (Admin)', avatar: 'BG' }
        ];

        const roleMenus = {
            resident: [
                { id: 'res_parcels', label: 'Hộp trực tuyến & Lấy hàng', icon: 'fa-boxes-packing' },
                { id: 'res_stations', label: 'Tra cứu trạm VELOBOX', icon: 'fa-map-location-dot' },
                { id: 'res_register', label: 'Đăng ký định danh Căn hộ', icon: 'fa-id-card' },
                { id: 'res_ticket', label: 'Báo cáo sự cố (Ticket)', icon: 'fa-triangle-exclamation' },
                { id: 'res_chat', label: 'Trợ lý ảo AI Chatbot', icon: 'fa-headset' }
            ],
            shipper: [
                { id: 'shp_drop', label: 'Quét & Thả hàng vào tủ', icon: 'fa-qrcode' },
                { id: 'shp_tasks', label: 'Nhiệm vụ giao hàng trong ca', icon: 'fa-list-check' },
                { id: 'shp_bug', label: 'Báo lỗi kẹt tủ / Hết ô', icon: 'fa-bug' },
                { id: 'shp_overdue', label: 'Thu hồi hàng tồn quá hạn', icon: 'fa-rotate-left' }
            ],
            admin: [
                { id: 'adm_dash', label: 'Tổng quan Dashboard IoT', icon: 'fa-chart-pie' },
                { id: 'adm_lockers', label: 'Quản lý Trạm & Mở khóa từ xa', icon: 'fa-server' },
                { id: 'adm_rbac', label: 'Quản lý Phân quyền (RBAC)', icon: 'fa-users-gear' },
                { id: 'adm_contract', label: 'Chữ ký số & Hóa đơn VAT', icon: 'fa-file-contract' },
                { id: 'adm_reports', label: 'Báo cáo hiệu suất lấp đầy', icon: 'fa-file-excel' }
            ]
        };

        function fillLogin(role, u, p) {
            document.getElementById('loginUsername').value = u;
            document.getElementById('loginPassword').value = p;
        }

        function handleLogin() {
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const foundUser = usersDatabase.find(x => x.username === u && x.pass === p);

            if (!foundUser) {
                alert('Tên đăng nhập hoặc mật khẩu không chính xác! (Hãy bấm nút chọn nhanh phía trên).');
                return;
            }

            appState.currentUser = foundUser;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            document.getElementById('userName').innerText = foundUser.name;
            document.getElementById('userRoleBadge').innerText = foundUser.badge;
            document.getElementById('userAvatar').innerText = foundUser.avatar;

            renderSidebar();
            renderWorkspace(roleMenus[foundUser.role][0].id);
        }

        function handleLogout() {
            appState.currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            const menus = roleMenus[appState.currentUser.role];
            nav.innerHTML = menus.map(m => `
                <button onclick="renderWorkspace('${m.id}')" class="w-full flex items-center space-x-3 px-3 py-3 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid ${m.icon} w-5 text-center"></i>
                    <span class="hidden md:inline">${m.label}</span>
                </button>
            `).join('');
        }

        function renderWorkspace(tabId) {
            const main = document.getElementById('mainContentArea');
            const role = appState.currentUser.role;

            if (role === 'resident') {
                if (tabId === 'res_parcels') {
                    main.innerHTML = `
                        <div class="p-6 max-w-5xl mx-auto space-y-6">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h2 class="text-xl font-bold text-slate-900">Hộp trực tuyến & Nhận bưu kiện tự động</h2>
                                    <p class="text-xs text-slate-500">Mã định danh bưu kiện đồng bộ thời gian thực từ trạm VELOBOX.</p>
                                </div>
                                <span class="bg-brand-100 text-brand-700 text-xs font-semibold px-3 py-1 rounded-full">Căn hộ A-1204</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${appState.parcels.map(p => `
                                    <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col justify-between">
                                        <div>
                                            <div class="flex justify-between items-center">
                                                <span class="text-xs font-bold text-brand-700 bg-brand-100 px-2.5 py-1 rounded">${p.id}</span>
                                                <span class="text-xs text-slate-500">${p.time}</span>
                                            </div>
                                            <h4 class="font-bold text-slate-800 text-sm mt-2">${p.store}</h4>
                                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot text-rose-500"></i> Ô tủ lưu trữ: <strong>${p.locker}</strong></p>
                                        </div>
                                        <div class="mt-4 pt-3 border-t flex justify-between items-center">
                                            <div>
                                                <span class="text-[10px] text-slate-400 block">Mã PIN bảo mật mở tủ</span>
                                                <span class="font-mono font-bold text-brand-600 text-base">${p.pin}</span>
                                            </div>
                                            ${p.overdue ? `
                                                <button onclick="openPaymentModal('${p.id}', ${p.fee})" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow">
                                                    <i class="fa-solid fa-qrcode mr-1"></i> Thanh toán quá hạn (${p.fee.toLocaleString()}đ)
                                                </button>
                                            ` : `
                                                <button onclick="residentOpenLocker('${p.id}')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow">
                                                    <i class="fa-solid fa-unlock mr-1"></i> Mở tủ lấy hàng
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (tabId === 'res_stations') {
                    main.innerHTML = `
                        <div class="p-6 max-w-4xl mx-auto space-y-6">
                            <h2 class="text-xl font-bold text-slate-900">Tra cứu Trạm VELOBOX & Ô trống</h2>
                            <div class="space-y-3">
                                <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                                    <div><h4 class="font-bold text-sm">VELOBOX Sảnh A - Chung cư Thủy Lợi</h4><p class="text-xs text-slate-500">Tầng 1, Tòa A • Khoảng cách: 0m</p></div>
                                    <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full">Trống 14/24 ô</span>
                                </div>
                                <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                                    <div><h4 class="font-bold text-sm">VELOBOX Hầm B1 - Khu để xe</h4><p class="text-xs text-slate-500">Tầng hầm B1, Tòa B • Khoảng cách: 120m</p></div>
                                    <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full">Trống 8/36 ô</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (tabId === 'res_register') {
                    main.innerHTML = `
                        <div class="p-6 max-w-xl mx-auto bg-white rounded-2xl border shadow-sm space-y-4">
                            <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-id-card text-brand-600"></i> Đăng ký & Định danh Cư dân</h2>
                            <div class="space-y-3 text-xs">
                                <div><label class="font-semibold text-slate-700 block mb-1">Họ và tên chủ căn hộ:</label><input type="text" value="Vũ Trần Huyền Linh" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div><label class="font-semibold text-slate-700 block mb-1">Tòa chung cư:</label><input type="text" value="Tòa A - Thủy Lợi" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                    <div><label class="font-semibold text-slate-700 block mb-1">Căn hộ số:</label><input type="text" value="1204" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                </div>
                                <div><label class="font-semibold text-slate-700 block mb-1">Số CCCD / Định danh cá nhân:</label><input type="text" value="001202003921" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                <button onclick="showToast('Đã gửi yêu cầu định danh căn hộ thành công qua SMS OTP!')" class="w-full bg-brand-600 text-white font-semibold py-3 rounded-xl text-xs shadow">Xác thực định danh Cư dân</button>
                            </div>
                        </div>
                    `;
                } else if (tabId === 'res_ticket') {
                    main.innerHTML = `
                        <div class="p-6 max-w-xl mx-auto bg-white rounded-2xl border shadow-sm space-y-4">
                            <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Báo cáo sự cố (Ticket Support)</h2>
                            <div class="space-y-3 text-xs">
                                <div><label class="font-semibold text-slate-700 block mb-1">Mã đơn hàng gặp sự cố:</label><input type="text" placeholder="Ví dụ: VB-89214" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                <div><label class="font-semibold text-slate-700 block mb-1">Vấn đề gặp phải:</label><select class="w-full bg-slate-50 border p-2.5 rounded-xl"><option>Tủ không mở cửa sau khi nhập mã PIN</option><option>Hàng hóa bên trong bị móp méo / thiếu</option></select></div>
                                <button onclick="showToast('Đã tạo Ticket thành công! Kỹ thuật viên sẽ kiểm tra sau 10 phút.')" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-xs shadow">Gửi Ticket khẩn cấp</button>
                            </div>
                        </div>
                    `;
                } else {
                    main.innerHTML = `
                        <div class="p-6 max-w-3xl mx-auto bg-white rounded-2xl border shadow-sm flex flex-col h-[500px]">
                            <div class="font-bold text-sm border-b pb-3 mb-3">VELOBOX AI Assistant Support 24/7</div>
                            <div class="flex-1 bg-slate-50 p-3 rounded-xl text-xs text-slate-700 overflow-y-auto">Chào Linh! Tôi là AI Assistant của VELOBOX. Tôi có thể hỗ trợ bạn giải đáp các vấn đề về thời gian lưu kho miễn phí 24h hoặc phí phát sinh.</div>
                            <div class="pt-3 flex gap-2"><input type="text" placeholder="Nhập câu hỏi..." class="flex-1 border p-2.5 rounded-xl text-xs"><button onclick="showToast('AI đang phản hồi...')" class="bg-brand-600 text-white px-4 rounded-xl text-xs">Gửi</button></div>
                        </div>
                    `;
                }
            }
            else if (role === 'shipper') {
                if (tabId === 'shp_drop') {
                    main.innerHTML = `
                        <div class="p-6 max-w-xl mx-auto bg-white rounded-2xl border shadow-sm space-y-4">
                            <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-qrcode text-brand-600"></i> Shipper Quét mã & Thả hàng vào tủ</h2>
                            <p class="text-xs text-slate-500">Hệ thống tự động liên kết OpenAPI với các sàn TMĐT để nhận diện cư dân.</p>
                            <div class="space-y-3 text-xs">
                                <div><label class="font-semibold text-slate-700 block mb-1">Mã vận đơn / Barcode:</label><input type="text" id="shipCode" placeholder="Nhập SPX-99385" class="w-full bg-slate-50 border p-2.5 rounded-xl"></div>
                                <div><label class="font-semibold text-slate-700 block mb-1">Chọn kích thước ô tủ tương thích:</label><select class="w-full bg-slate-50 border p-2.5 rounded-xl"><option>Cỡ S (Nhỏ - Mỹ phẩm)</option><option selected>Cỡ M (Trung bình - Quần áo)</option><option>Cỡ L (Lớn - Cồng kềnh)</option></select></div>
                                <button onclick="shipperDropOrder()" class="w-full bg-brand-600 text-white font-semibold py-3 rounded-xl text-xs shadow">Xác nhận mở ô tủ & Gửi Zalo ZNS cho Cư dân</button>
                            </div>
                        </div>
                    `;
                } else if (tabId === 'shp_tasks') {
                    main.innerHTML = `<div class="p-6 max-w-4xl mx-auto bg-white rounded-2xl border shadow-sm"><h2 class="text-lg font-bold">Nhiệm vụ giao hàng trong ca</h2><p class="text-xs text-slate-500 mt-2">Đang phân bổ 3 bưu kiện cần nạp vào trạm tủ Sảnh A.</p></div>`;
                } else if (tabId === 'shp_bug') {
                    main.innerHTML = `
                        <div class="p-6 max-w-xl mx-auto bg-white rounded-2xl border shadow-sm space-y-4">
                            <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-bug text-rose-500"></i> Báo cáo lỗi kẹt tủ / Hết ô</h2>
                            <div class="space-y-3 text-xs">
                                <div><label class="font-semibold text-slate-700 block mb-1">Chọn sự cố phần cứng:</label><select class="w-full bg-slate-50 border p-2.5 rounded-xl"><option>Trạm tủ hết ô trống kích thước phù hợp</option><option>Cảm biến Loadcell / Khóa từ ô tủ bị lỗi</option></select></div>
                                <button onclick="showToast('Đã gửi báo cáo lỗi lên kỹ thuật viên trực trạm!')" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-xs shadow">Gửi báo cáo lỗi phần cứng</button>
                            </div>
                        </div>
                    `;
                } else {
                    main.innerHTML = `<div class="p-6 max-w-4xl mx-auto bg-white rounded-2xl border shadow-sm"><h2 class="text-lg font-bold">Thu hồi hàng tồn quá hạn</h2><p class="text-xs text-slate-500 mt-2">Không có kiện hàng nào quá 48h tại trạm này.</p></div>`;
                }
            }
            else if (role === 'admin') {
                if (tabId === 'adm_dash') {
                    main.innerHTML = `
                        <div class="p-6 max-w-6xl mx-auto space-y-6">
                            <h2 class="text-xl font-bold text-slate-900">Dashboard Quản trị Tổng quan hệ thống</h2>
                            <div class="grid grid-cols-3 gap-4">
                                <div class="bg-white p-5 rounded-2xl border shadow-sm"><div class="text-xs text-slate-500">Tổng trạm VELOBOX</div><div class="text-2xl font-bold text-slate-900 mt-1">3 Trạm</div></div>
                                <div class="bg-white p-5 rounded-2xl border shadow-sm"><div class="text-xs text-slate-500">Hộp trực tuyến đang chạy</div><div class="text-2xl font-bold text-brand-600 mt-1">${appState.parcels.length} Đơn</div></div>
                                <div class="bg-white p-5 rounded-2xl border shadow-sm"><div class="text-xs text-slate-500">Trạng thái phần cứng IoT</div><div class="text-2xl font-bold text-emerald-600 mt-1">Ổn định 100%</div></div>
                            </div>
                        </div>
                    `;
                } else if (tabId === 'adm_lockers') {
                    main.innerHTML = `
                        <div class="p-6 max-w-5xl mx-auto space-y-6">
                            <h2 class="text-xl font-bold text-slate-900">Giám sát Trạm tủ & Mở khóa từ xa</h2>
                            <div class="bg-white p-5 rounded-2xl border space-y-3">
                                ${appState.lockers.map(l => `
                                    <div class="p-3 border rounded-xl flex justify-between items-center text-xs">
                                        <div><strong>Ô tủ: ${l.id}</strong> (Cỡ ${l.size})</div>
                                        <span class="px-2.5 py-1 rounded-full font-semibold ${l.status === 'available' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${l.status === 'available' ? 'Trống' : 'Đang chứa hàng'}</span>
                                        <button onclick="showToast('Đã gửi lệnh kích hoạt rơ-le mở khóa ô ${l.id} từ xa!')" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg">Mở từ xa</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else if (tabId === 'adm_rbac') {
                    main.innerHTML = `
                        <div class="p-6 max-w-5xl mx-auto space-y-6">
                            <h2 class="text-xl font-bold text-slate-900">Quản lý Phân quyền Tài khoản (RBAC)</h2>
                            <div class="bg-white rounded-2xl border p-4 text-xs shadow-sm">
                                <table class="w-full text-left">
                                    <tr class="bg-slate-100"><th class="p-3">Nhóm người dùng</th><th class="p-3">Phạm vi quyền hạn (Scope)</th><th class="p-3">Trạng thái</th></tr>
                                    <tr class="border-b"><td class="p-3 font-bold">Cư dân</td><td class="p-3">Tra cứu hộp trực tuyến, lấy mã PIN, báo cáo sự cố</td><td class="p-3 text-emerald-600">Hoạt động</td></tr>
                                    <tr class="border-b"><td class="p-3 font-bold">Shipper Partner</td><td class="p-3">Quét mã thả hàng, báo lỗi kỹ thuật, thu hồi đơn</td><td class="p-3 text-emerald-600">Hoạt động</td></tr>
                                    <tr><td class="p-3 font-bold">Quản trị viên (Admin)</td><td class="p-3">Toàn quyền hệ thống, mở khóa từ xa, ký số hợp đồng</td><td class="p-3 text-emerald-600">Hoạt động</td></tr>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (tabId === 'adm_contract') {
                    main.innerHTML = `
                        <div class="p-6 max-w-4xl mx-auto grid grid-cols-2 gap-4">
                            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-2">
                                <h3 class="font-bold text-sm"><i class="fa-solid fa-file-contract text-brand-600"></i> Chữ ký số Hợp đồng</h3>
                                <p class="text-xs text-slate-500">Ký kết điện tử hợp đồng đặt trạm tủ thông minh với Ban quản lý chung cư.</p>
                                <button onclick="showToast('Đã ký số thành công hợp đồng thuê mặt bằng!')" class="bg-brand-600 text-white text-xs px-3.5 py-2 rounded-xl shadow">Ký hợp đồng Chữ ký số</button>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-2">
                                <h3 class="font-bold text-sm"><i class="fa-solid fa-receipt text-blue-600"></i> Hóa đơn VAT Điện tử</h3>
                                <p class="text-xs text-slate-500">Tự động xuất hóa đơn tài chính và đối soát doanh thu phí lưu kho.</p>
                                <button onclick="showToast('Đã xuất thành công hóa đơn điện tử VAT!')" class="bg-blue-600 text-white text-xs px-3.5 py-2 rounded-xl shadow">Xuất hóa đơn VAT</button>
                            </div>
                        </div>
                    `;
                } else {
                    main.innerHTML = `
                        <div class="p-6 max-w-4xl mx-auto bg-white rounded-2xl border shadow-sm space-y-4">
                            <h2 class="text-lg font-bold">Báo cáo Thống kê Hiệu suất Lấp đầy Ô tủ</h2>
                            <p class="text-xs text-slate-500">Trích xuất dữ liệu phân tích tỷ lệ sử dụng trạm tủ theo định kỳ hàng tháng.</p>
                            <button onclick="showToast('Đã tải xuống file báo cáo Excel thành công!')" class="bg-emerald-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow"><i class="fa-solid fa-download mr-1"></i> Tải xuống báo cáo thống kê</button>
                        </div>
                    `;
                }
            }
        }

        function openPaymentModal(parcelId, fee) {
            const html = `
                <div id="paymentModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                        <h3 class="font-bold text-slate-900 text-base">Thanh toán Phí lưu kho Quá hạn</h3>
                        <p class="text-xs text-slate-500">Đơn hàng <strong class="text-brand-600">${parcelId}</strong> lưu kho vượt quá 24h.</p>
                        <div class="bg-slate-50 p-4 rounded-2xl border">
                            <div class="text-xs text-slate-500">Cước phí phát sinh:</div>
                            <div class="text-xl font-bold text-amber-600 mt-1">${fee.toLocaleString()} VNĐ</div>
                            <div class="w-28 h-28 bg-white border mx-auto mt-3 rounded-xl flex items-center justify-center text-[10px] font-mono font-bold shadow-inner">
                                [ VIETQR DYNAMIC ]
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="closeModal()" class="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-semibold">Hủy</button>
                            <button onclick="confirmPayment('${parcelId}')" class="flex-1 bg-brand-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Xác nhận Đã trả phí</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function closeModal() {
            const m = document.getElementById('paymentModal');
            if (m) m.remove();
        }

        function confirmPayment(parcelId) {
            const p = appState.parcels.find(x => x.id === parcelId);
            if (p) { p.overdue = false; p.fee = 0; p.status = 'Chờ lấy hàng'; }
            closeModal();
            showToast('Thanh toán thành công! Đã cấp lệnh mở ô tủ.');
            renderWorkspace('res_parcels');
        }

        function residentOpenLocker(parcelId) {
            if (confirm(`Xác nhận mở ô tủ để nhận bưu kiện ${parcelId}?`)) {
                appState.parcels = appState.parcels.filter(x => x.id !== parcelId);
                showToast('Mở tủ thành công! Đã giải phóng ô tủ.');
                renderWorkspace('res_parcels');
            }
        }

        function shipperDropOrder() {
            const code = document.getElementById('shipCode').value.trim();
            if (!code) { alert('Vui lòng nhập mã vận đơn!'); return; }
            const pin = Math.floor(100000 + Math.random() * 900000).toString();
            appState.parcels.push({
                id: code,
                store: 'Shopee - Hàng mới về',
                receiver: 'Vũ Trần Huyền Linh',
                locker: 'B-02 (M)',
                status: 'Chờ lấy hàng',
                time: 'Vừa xong',
                pin: pin,
                fee: 0,
                overdue: false
            });
            document.getElementById('shipCode').value = '';
            showToast(`Thành công! Đã nạp đơn vào ô B-02 và gửi mã PIN (${pin}) sang Zalo cư dân.`);
        }

        function showToast(message) {
            const t = `<div class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-2"><i class="fa-solid fa-circle-check text-brand-400"></i> ${message}</div>`;
            document.body.insertAdjacentHTML('beforeend', t);
            setTimeout(() => { document.querySelector('.fixed.bottom-5.right-5')?.remove(); }, 3000);
        }
    </script>
</body>
</html>
